name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Auto-bump and push the next vX.Y.Z tag. No manual version bumping required --
      # every push to main gets the next patch version by default. Previously delegated
      # to anothrNick/github-tag-action, a third-party action pinned only by a mutable
      # tag while this job holds contents:write + packages:write -- whoever controlled
      # that tag controlled a token able to push to this repo and this package registry.
      # Inlined instead of trusting (and SHA-pinning) that action, since the logic is
      # small enough not to need a dependency at all.
      - id: tag
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          last_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last_tag" ]; then
            new_tag="v2.2.0"  # only takes effect on a fresh repo with no matching tags at all
          else
            ver="${last_tag#v}"
            IFS=. read -r major minor patch <<< "$ver"
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Bumping $last_tag -> $new_tag"
          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"
          git tag "$new_tag"
          git push origin "$new_tag"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.new_tag }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.new_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
