networks:
  backend:
    external: true
    name: "backend"
services:
  carl:
    container_name: "carl"
    env_file: .env
    hostname: "carl"
    image: "ghcr.io/dftba-club/carl:latest"
    restart: "unless-stopped"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: "256m"
    cpus: "0.5"
    pids_limit: 64
